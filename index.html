<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPERBOS — Sistem Pertanggungjawaban Dana BOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --navy:#173254;
    --navy-deep:#0e2138;
    --gold:#b8862f;
    --gold-light:#e8c674;
    --paper:#f6f4ef;
    --paper-card:#ffffff;
    --ink:#1f2937;
    --ink-soft:#5b6472;
    --line:#dfdbd0;
    --green:#2f7a4b;
    --red:#a83b2b;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Lora',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  /* Layout */
  #app{display:flex;min-height:100vh;}
  #sidebar{
    width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#eef2f6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  #sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
  #sidebar .brand .mark{font-family:'Lora',serif;font-weight:700;font-size:20px;letter-spacing:.3px;color:#fff;}
  #sidebar .brand .sub{font-size:11px;color:var(--gold-light);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
  #sidebar nav{padding:10px 0;flex:1;}
  .navgroup-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#8ea3ba;padding:14px 20px 6px;}
  .navbtn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    color:#d7e1ec;padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid transparent;
  }
  .navbtn:hover{background:rgba(255,255,255,.06);}
  .navbtn.active{background:rgba(184,134,47,.16);border-left:3px solid var(--gold);color:#fff;font-weight:600;}
  .navbtn .ic{width:16px;text-align:center;opacity:.85;}
  #sidebar .foot{padding:14px 20px;font-size:10.5px;color:#7d90a6;border-top:1px solid rgba(255,255,255,.1);}

  #main{flex:1;min-width:0;padding:28px 34px 60px;}
  .pagehead{margin-bottom:22px;}
  .pagehead .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:600;}
  .pagehead h1{font-size:26px;margin:4px 0 4px;color:var(--navy-deep);}
  .pagehead p{margin:0;color:var(--ink-soft);font-size:13.5px;}

  .card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h2{font-size:16px;margin:0 0 14px;color:var(--navy-deep);}
  .card h3{font-size:14px;margin:0 0 10px;color:var(--navy);}

  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  .stat{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;border-top:3px solid var(--gold);}
  .stat .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .stat .val{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;color:var(--navy-deep);margin-top:4px;}
  .stat.pos{border-top-color:var(--green);}
  .stat.neg{border-top-color:var(--red);}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:0 0 4px;}
  input,select,textarea{
    width:100%;padding:8px 10px;border:1px solid #cfcabb;border-radius:4px;font-family:'Inter',sans-serif;
    font-size:13.5px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);border-color:var(--gold);}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:150px;}

  button{cursor:pointer;font-family:'Inter',sans-serif;}
  .btn{
    background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:4px;font-size:13px;font-weight:600;
  }
  .btn:hover{background:var(--navy-deep);}
  .btn.gold{background:var(--gold);}
  .btn.gold:hover{background:#a37728;}
  .btn.outline{background:none;border:1px solid var(--navy);color:var(--navy);}
  .btn.outline:hover{background:#eef2f7;}
  .btn.danger{background:none;border:1px solid var(--red);color:var(--red);padding:5px 10px;font-size:12px;}
  .btn.danger:hover{background:#fbecea;}
  .btn.sm{padding:5px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{background:#eef1ee;color:var(--navy-deep);text-align:left;padding:8px 9px;font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);}
  td{padding:7px 9px;border-bottom:1px solid #ece8dd;vertical-align:top;}
  tr:hover td{background:#faf9f5;}
  .num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.8px;font-weight:600;}
  .tag.tunai{background:#e7f3ea;color:var(--green);}
  .tag.bank{background:#e8eef7;color:var(--navy);}
  .tag.masuk{background:#e7f3ea;color:var(--green);}
  .tag.keluar{background:#fbeceb;color:var(--red);}

  .empty{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);}
  .hint{font-size:11.8px;color:var(--ink-soft);margin-top:3px;}
  .section-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .section-tabs button{background:none;border:none;padding:9px 14px;font-size:13px;color:var(--ink-soft);border-bottom:2px solid transparent;font-weight:600;}
  .section-tabs button.active{color:var(--navy-deep);border-bottom:2px solid var(--gold);}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;opacity:0;transform:translateY(10px);transition:.25s;}
  .toast.show{opacity:1;transform:translateY(0);}
  .letterhead{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:16px;}
  .letterhead .sch{font-family:'Lora',serif;font-weight:700;font-size:16px;color:var(--navy-deep);}
  .letterhead .addr{font-size:11.5px;color:var(--ink-soft);}
  .modal-bg{position:fixed;inset:0;background:rgba(14,33,56,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:200;}
  .modal{background:#fff;border-radius:8px;padding:22px;max-width:560px;width:100%;}
  .modal h3{margin-top:0;}
  .closex{float:right;background:none;border:none;font-size:18px;color:var(--ink-soft);}
  @media print{
    #sidebar,.no-print{display:none!important;}
    #main{padding:0;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">SIPERBOS</div>
      <div class="sub">Pertanggungjawaban Dana BOS</div>
    </div>
    <nav id="navlist"></nav>
    <div class="foot" id="sidebarFoot">Data tersimpan lokal di perangkat ini.<br>v2.0 · terinspirasi SmartSPJ</div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>

<script>
/* ============ DATA LAYER (localStorage) ============ */
const DB_KEY = 'siperbos_v2';
const defaultDB = {
  profil:{ namaSekolah:'SD NEGERI 4 MEREMBU', npsn:'', alamat:'', kecamatan:'Labuapi', kabupaten:'Lombok Barat', pemerintahKab:'PEMERINTAH KABUPATEN LOMBOK BARAT', dinas:'DINAS PENDIDIKAN DAN KEBUDAYAAN', kodePos:'', kepsek:'Darmawan, S.Pd', nipKepsek:'', bendahara:'Maemunah, S.Pd', nipBendahara:'', tahunAnggaran:'2026' },
  penerimaan: [],
  rkas: [],
  transaksi: [], // BKU: {id,tanggal,noBukti,uraian,kodeRekening,sumberDana,jenisPembayaran(tunai/bank),tipe(masuk/keluar),jumlahBruto,pajak:{jenis,persen,nominal},jumlahNetto}
  kwitansi: [],
  notaPesanan: [],
  sppd: [],
  suratTugas: [],
  checklistSpj: [],
  rekonsiliasi: [],
  auth: {
    admin:{ username:'admin', password:'admin123', nama:'Administrator' },
    bendahara:{ username:'bendahara', password:'bendahara123', nama:'Bendahara BOS' }
  }
};
function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); if(!raw) return structuredClone(defaultDB); const d = JSON.parse(raw); return {...structuredClone(defaultDB), ...d}; }
  catch(e){ return structuredClone(defaultDB); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
let DB = loadDB();
if(!DB.auth){ DB.auth = structuredClone(defaultDB.auth); saveDB(); }

/* ============ AUTH / LOGIN ============ */
const SESSION_KEY = 'siperbos_session';
function getSession(){ try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function setSession(role){ sessionStorage.setItem(SESSION_KEY, JSON.stringify({role, at:Date.now()})); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }
let currentSession = getSession();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtRp(n){ n = Number(n)||0; return 'Rp ' + n.toLocaleString('id-ID'); }
function fmtDate(d){ if(!d) return '-'; const dt = new Date(d); return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

/* Preset jenis kegiatan -> jenis pajak & persentase (acuan umum, bisa disesuaikan) */
const PAJAK_PRESET = {
  'Honorarium (Non-PNS)':      {jenis:'PPh 21 Final', persen:5},
  'Honorarium (PNS Gol III/IV)':{jenis:'PPh 21 Final', persen:5},
  'Belanja Barang/Jasa (Rekanan PKP)': {jenis:'PPN', persen:11},
  'Belanja Barang (Non PKP < 2jt)': {jenis:'Tidak dipungut', persen:0},
  'Jasa Tukang/Perorangan':    {jenis:'PPh 21 Final', persen:2.5},
  'Jasa Pelatih Ekstrakurikuler': {jenis:'PPh 21 Final', persen:5},
  'Sewa (PPh 4 ayat 2)':       {jenis:'PPh Final Sewa', persen:10},
  'Belanja Jasa Badan (PPh 23)': {jenis:'PPh 23', persen:2},
  'Langganan Daya & Jasa':     {jenis:'Tidak dipungut', persen:0},
  'Perjalanan Dinas':          {jenis:'Tidak dipungut', persen:0},
  'Lainnya (manual)':          {jenis:'Manual', persen:0}
};

/* ============ NAV ============ */
const NAV = [
  {group:'Ringkasan', items:[
    {id:'dasbor', label:'Dasbor', ic:'◆'}
  ]},
  {group:'Data Dasar', items:[
    {id:'profil', label:'Profil Sekolah', ic:'▤'},
    {id:'penerimaan', label:'Penerimaan Dana', ic:'⬇'},
    {id:'rkas', label:'RKAS & Kode Rekening', ic:'▦'}
  ]},
  {group:'Penatausahaan', items:[
    {id:'bku', label:'Buku Kas Umum', ic:'✎'},
    {id:'pembantu', label:'Buku Pembantu', ic:'▥'},
    {id:'dokumen', label:'Kwitansi, Nota & Surat', ic:'▧'}
  ]},
  {group:'Pelaporan', items:[
    {id:'checklist', label:'Checklist SPJ', ic:'☑'},
    {id:'laporan', label:'Laporan & Cetak', ic:'▣'}
  ]},
  {group:'Utilitas', items:[
    {id:'akun', label:'Pengaturan Akun', ic:'●'},
    {id:'backup', label:'Cadangkan Data', ic:'⟳'}
  ]}
];
let currentPage = 'dasbor';

function renderNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = NAV.map(g=>`
    <div class="navgroup-label">${g.group}</div>
    ${g.items.map(it=>`<button class="navbtn ${currentPage===it.id?'active':''}" data-page="${it.id}"><span class="ic">${it.ic}</span>${it.label}</button>`).join('')}
  `).join('');
  nav.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{ currentPage=b.dataset.page; render(); }));
  const foot = document.getElementById('sidebarFoot');
  if(foot && currentSession){
    const acc = DB.auth[currentSession.role];
    foot.innerHTML = `Masuk sebagai <b style="color:#fff;">${acc?acc.nama:currentSession.role}</b> (${currentSession.role})<br>
    <button class="btn sm outline" id="btnLogout" style="margin-top:8px;color:#fff;border-color:rgba(255,255,255,.4);">Keluar</button>`;
    setTimeout(()=>{ const bl = document.getElementById('btnLogout'); if(bl) bl.addEventListener('click', doLogout); },0);
  }
}

/* ============ RENDER ROUTER ============ */
function render(){
  currentSession = getSession();
  if(!currentSession){ renderLogin(); return; }
  document.getElementById('app').style.display = 'flex';
  renderNav();
  const main = document.getElementById('main');
  const pages = { dasbor:pageDasbor, profil:pageProfil, penerimaan:pagePenerimaan, rkas:pageRkas, bku:pageBKU, pembantu:pagePembantu, dokumen:pageDokumen, checklist:pageChecklist, laporan:pageLaporan, backup:pageBackup, akun:pageAkun };
  main.innerHTML = pages[currentPage] ? pages[currentPage]() : '<div class="empty">Halaman tidak ditemukan</div>';
  attachPageEvents();
}

function renderLogin(){
  document.getElementById('app').style.display = 'none';
  let box = document.getElementById('loginBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'loginBox';
    document.body.appendChild(box);
  }
  box.innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%, var(--navy-deep) 100%);">
    <div style="background:#fff;border-radius:10px;padding:34px 32px;max-width:380px;width:92%;box-shadow:0 20px 50px rgba(0,0,0,.35);">
      <div style="text-align:center;margin-bottom:18px;">
        <div class="serif" style="font-weight:700;font-size:22px;color:var(--navy-deep);">SIPERBOS</div>
        <div style="font-size:11.5px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;">Masuk ke Aplikasi</div>
      </div>
      <div class="field"><label>Peran</label>
        <select id="login_role"><option value="admin">Admin</option><option value="bendahara">Bendahara</option></select>
      </div>
      <div class="field"><label>Username</label><input id="login_username" placeholder="username"></div>
      <div class="field"><label>Kata Sandi</label><input type="password" id="login_password" placeholder="kata sandi"></div>
      <div id="loginError" style="color:var(--red);font-size:12.5px;margin-bottom:8px;"></div>
      <button class="btn gold" id="btnLogin" style="width:100%;">Masuk</button>
      <div class="hint" style="text-align:center;margin-top:14px;">Default: admin/admin123 atau bendahara/bendahara123 — segera ganti di menu Pengaturan Akun setelah masuk.</div>
    </div>
  </div>`;
  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('login_password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
function doLogin(){
  const role = document.getElementById('login_role').value;
  const u = document.getElementById('login_username').value.trim();
  const pw = document.getElementById('login_password').value;
  const acc = DB.auth[role];
  if(acc && acc.username === u && acc.password === pw){
    setSession(role);
    document.getElementById('loginBox').remove();
    render();
  } else {
    document.getElementById('loginError').textContent = 'Username atau kata sandi salah.';
  }
}
function doLogout(){
  clearSession();
  render();
}

function head(eyebrow,title,desc){
  return `<div class="pagehead"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>`;
}

/* ============ DASBOR ============ */
function pageDasbor(){
  const totalPenerimaan = DB.penerimaan.reduce((s,p)=>s+Number(p.jumlah||0),0);
  const totalMasuk = DB.transaksi.filter(t=>t.tipe==='masuk').reduce((s,t)=>s+Number(t.jumlahNetto||0),0);
  const totalKeluar = DB.transaksi.filter(t=>t.tipe==='keluar').reduce((s,t)=>s+Number(t.jumlahNetto||0),0);
  const saldoTunai = DB.transaksi.filter(t=>t.jenisPembayaran==='tunai').reduce((s,t)=> s + (t.tipe==='masuk'?Number(t.jumlahNetto||0):-Number(t.jumlahNetto||0)),0);
  const saldoBank = DB.transaksi.filter(t=>t.jenisPembayaran==='bank').reduce((s,t)=> s + (t.tipe==='masuk'?Number(t.jumlahNetto||0):-Number(t.jumlahNetto||0)),0);
  const totalPajak = DB.transaksi.reduce((s,t)=> s + Number(t.pajak?.nominal||0),0);
  const totalRKAS = DB.rkas.reduce((s,r)=>s+Number(r.jumlah||0),0);

  const recent = [...DB.transaksi].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal)).slice(0,6);

  return `
  ${head('SDN 4 Merembujaya','Dasbor','Ringkasan keuangan dana BOS tahun anggaran '+ (DB.profil.tahunAnggaran||'-'))}
  <div class="grid grid-4">
    <div class="stat pos"><div class="lbl">Total Penerimaan Dana</div><div class="val">${fmtRp(totalPenerimaan)}</div></div>
    <div class="stat"><div class="lbl">Total Belanja RKAS</div><div class="val">${fmtRp(totalRKAS)}</div></div>
    <div class="stat neg"><div class="lbl">Total Pengeluaran BKU</div><div class="val">${fmtRp(totalKeluar)}</div></div>
    <div class="stat"><div class="lbl">Pajak Terpotong</div><div class="val">${fmtRp(totalPajak)}</div></div>
  </div>
  <div class="grid grid-2" style="margin-top:4px;">
    <div class="stat"><div class="lbl">Saldo Kas Tunai</div><div class="val">${fmtRp(saldoTunai)}</div></div>
    <div class="stat"><div class="lbl">Saldo Kas Bank</div><div class="val">${fmtRp(saldoBank)}</div></div>
  </div>
  <div class="card" style="margin-top:18px;">
    <h2>Transaksi Terbaru</h2>
    ${recent.length===0?'<div class="empty">Belum ada transaksi BKU. Mulai input di menu Buku Kas Umum.</div>':`
    <table><thead><tr><th>Tanggal</th><th>Uraian</th><th>Jenis</th><th>Metode</th><th class="num">Netto</th></tr></thead>
    <tbody>${recent.map(t=>`<tr><td>${fmtDate(t.tanggal)}</td><td>${t.uraian}</td><td><span class="tag ${t.tipe==='masuk'?'masuk':'keluar'}">${t.tipe==='masuk'?'Masuk':'Keluar'}</span></td><td><span class="tag ${t.jenisPembayaran}">${t.jenisPembayaran==='tunai'?'Tunai':'Bank'}</span></td><td class="num">${fmtRp(t.jumlahNetto)}</td></tr>`).join('')}</tbody></table>`}
  </div>`;
}

/* ============ PROFIL ============ */
function pageProfil(){
  const p = DB.profil;
  return `
  ${head('Data Dasar','Profil Sekolah','Data ini digunakan sebagai kop surat pada dokumen laporan dan kwitansi.')}
  <div class="card">
  <div class="grid grid-2">
      <div class="field"><label>Nama Pemerintah Kabupaten/Kota (baris 1 kop)</label><input id="f_pemerintahKab" value="${p.pemerintahKab||''}"></div>
      <div class="field"><label>Nama Dinas (baris 2 kop)</label><input id="f_dinas" value="${p.dinas||''}"></div>
      <div class="field"><label>Nama Sekolah</label><input id="f_namaSekolah" value="${p.namaSekolah}"></div>
      <div class="field"><label>NPSN</label><input id="f_npsn" value="${p.npsn}"></div>
      <div class="field"><label>Alamat</label><input id="f_alamat" value="${p.alamat}"></div>
      <div class="field"><label>Kecamatan</label><input id="f_kecamatan" value="${p.kecamatan}"></div>
      <div class="field"><label>Kabupaten/Kota</label><input id="f_kabupaten" value="${p.kabupaten}"></div>
      <div class="field"><label>Kode Pos</label><input id="f_kodePos" value="${p.kodePos||''}"></div>
      <div class="field"><label>Tahun Anggaran</label><input id="f_tahunAnggaran" value="${p.tahunAnggaran}"></div>
      <div class="field"><label>Nama Kepala Sekolah</label><input id="f_kepsek" value="${p.kepsek}"></div>
      <div class="field"><label>NIP Kepala Sekolah</label><input id="f_nipKepsek" value="${p.nipKepsek}"></div>
      <div class="field"><label>Nama Bendahara BOS</label><input id="f_bendahara" value="${p.bendahara}"></div>
      <div class="field"><label>NIP Bendahara</label><input id="f_nipBendahara" value="${p.nipBendahara}"></div>
    </div>
    <button class="btn gold" id="btnSaveProfil">Simpan Profil</button>
  </div>`;
}

/* ============ PENERIMAAN ============ */
function pagePenerimaan(){
  const rows = DB.penerimaan;
  return `
  ${head('Data Dasar','Penerimaan Dana','Catat setiap pencairan dana BOS per tahap/triwulan.')}
  <div class="card">
    <h2>Tambah Penerimaan</h2>
    <div class="row">

/* ============ TERBILANG ============ */
const SATUAN_KATA = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function terbilangInt(n){
  n = Math.floor(n);
  if(n < 12) return SATUAN_KATA[n];
  if(n < 20) return terbilangInt(n-10)+' belas';
  if(n < 100) return terbilangInt(Math.floor(n/10))+' puluh'+(n%10?' '+terbilangInt(n%10):'');
  if(n < 200) return 'seratus'+(n%100?' '+terbilangInt(n%100):'');
  if(n < 1000) return terbilangInt(Math.floor(n/100))+' ratus'+(n%100?' '+terbilangInt(n%100):'');
  if(n < 2000) return 'seribu'+(n%1000?' '+terbilangInt(n%1000):'');
  if(n < 1000000) return terbilangInt(Math.floor(n/1000))+' ribu'+(n%1000?' '+terbilangInt(n%1000):'');
  if(n < 1000000000) return terbilangInt(Math.floor(n/1000000))+' juta'+(n%1000000?' '+terbilangInt(n%1000000):'');
  return terbilangInt(Math.floor(n/1000000000))+' milyar'+(n%1000000000?' '+terbilangInt(n%1000000000):'');
}
function terbilang(n){
  n = Math.round(Number(n)||0);
  if(n===0) return 'nol rupiah';
  const words = terbilangInt(n).replace(/\s+/g,' ').trim();
  return words.charAt(0).toUpperCase()+words.slice(1)+' rupiah';
}

function generateLaporanHtml(sumber, periode){
  const trans = DB.transaksi; // simple: not filtered by sumberDana field since BKU form currently doesn't tag sumberDana; use all
  const totalMasuk = trans.filter(t=>t.tipe==='masuk').reduce((s,t)=>s+Number(t.jumlahNetto||0),0);
  const totalKeluar = trans.filter(t=>t.tipe==='keluar').reduce((s,t)=>s+Number(t.jumlahNetto||0),0);
  const totalPenerimaanDana = DB.penerimaan.filter(p=>p.sumber===sumber).reduce((s,p)=>s+Number(p.jumlah||0),0);
  const totalPajak = trans.reduce((s,t)=>s+Number(t.pajak?.nominal||0),0);
  const saldoAkhir = totalPenerimaanDana + totalMasuk - totalKeluar;
  const p = DB.profil;
  return `
  <div class="card" id="laporanCetak">
    <div class="letterhead">
      <div class="sch">${p.namaSekolah||'(Nama Sekolah belum diisi)'}</div>
      <div class="addr">${p.alamat||''} ${p.kecamatan?', '+p.kecamatan:''} ${p.kabupaten?', '+p.kabupaten:''}</div>
      <div class="addr">NPSN: ${p.npsn||'-'}</div>
    </div>
    <h3 style="text-align:center;">BERITA ACARA REKONSILIASI DANA BOS</h3>
    <p style="text-align:center;margin-top:-6px;color:var(--ink-soft);">Sumber Dana: ${sumber} — Periode: ${periode} — Tahun Anggaran ${p.tahunAnggaran}</p>
    <table>
      <tbody>
        <tr><td>Total Dana Diterima</td><td class="num">${fmtRp(totalPenerimaanDana)}</td></tr>
        <tr><td>Total Penerimaan Lain (BKU)</td><td class="num">${fmtRp(totalMasuk)}</td></tr>
        <tr><td>Total Pengeluaran / Realisasi</td><td class="num">${fmtRp(totalKeluar)}</td></tr>
        <tr><td>Total Pajak Dipungut/Disetor</td><td class="num">${fmtRp(totalPajak)}</td></tr>
        <tr><td><b>Saldo Kas Akhir</b></td><td class="num"><b>${fmtRp(saldoAkhir)}</b></td></tr>
      </tbody>
    </table>
    <div class="grid grid-2" style="margin-top:34px;">
      <div style="text-align:center;">
        <div>Bendahara BOS</div><br><br><br>
        <div><b>${p.bendahara||'( ______________ )'}</b></div>
        <div>NIP. ${p.nipBendahara||'-'}</div>
      </div>
      <div style="text-align:center;">
        <div>Kepala Sekolah</div><br><br><br>
        <div><b>${p.kepsek||'( ______________ )'}</b></div>
        <div>NIP. ${p.nipKepsek||'-'}</div>
      </div>
    </div>
    <div class="no-print" style="margin-top:18px;"><button class="btn outline" onclick="window.print()">Cetak / Simpan PDF</button></div>
  </div>`;
}

/* ============ EVENTS ============ */
function attachPageEvents(){
  // Profil
  const btnSaveProfil = document.getElementById('btnSaveProfil');
  if(btnSaveProfil) btnSaveProfil.addEventListener('click', ()=>{
    ['pemerintahKab','dinas','namaSekolah','npsn','alamat','kecamatan','kabupaten','kodePos','tahunAnggaran','kepsek','nipKepsek','bendahara','nipBendahara'].forEach(k=>{
      DB.profil[k] = document.getElementById('f_'+k).value;
    });
    saveDB(); toast('Profil sekolah disimpan.');
  });

  // Penerimaan
  const btnAddPenerimaan = document.getElementById('btnAddPenerimaan');
  if(btnAddPenerimaan) btnAddPenerimaan.addEventListener('click', ()=>{
    const tanggal = document.getElementById('p_tanggal').value;
    const jumlah = document.getElementById('p_jumlah').value;

/* ============ IMPORTIR RPD/RKAS & BKU (Excel/CSV) ============ */
const BULAN_ID = {januari:0,februari:1,maret:2,april:3,mei:4,juni:5,juli:6,agustus:7,september:8,oktober:9,november:10,desember:11};
function parseIndoDate(val){
  if(val==null || val==='') return '';
  if(typeof val === 'number'){ // Excel serial date
    const d = XLSX.SSF.parse_date_code(val);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = String(val).trim().toLowerCase();
  const m = s.match(/(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/);
  if(m){
    const day = m[1].padStart(2,'0');
    const bln = BULAN_ID[m[2]];
    if(bln!=null) return `${m[3]}-${String(bln+1).padStart(2,'0')}-${day}`;
  }
  const m2 = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
  const m3 = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m3) return `${m3[3]}-${m3[2].padStart(2,'0')}-${m3[1].padStart(2,'0')}`;
  return '';
}
function toNumber(v){
  if(v==null || v==='') return 0;
  if(typeof v === 'number') return v;
  const s = String(v).replace(/[^\d,.\-]/g,'').replace(/\./g,'').replace(/,/g,'.');
  const n = parseFloat(s);
  return isNaN(n)?0:n;
}
function readSheetRows(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const wb = XLSX.read(e.target.result, {type:'binary', cellDates:false});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
    cb(rows);
  };
  reader.readAsBinaryString(file);
}
function findHeaderRow(rows, keywordSets){
  let bestIdx = 0, bestScore = -1;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const rowText = rows[i].map(c=>String(c||'').toLowerCase().trim());
    let score = 0;
    keywordSets.forEach(kw=>{ if(rowText.some(c=>c.includes(kw))) score++; });
    if(score > bestScore){ bestScore = score; bestIdx = i; }
  }
  return bestIdx;
}
function colIndexFor(headerRow, aliases){
  const norm = headerRow.map(c=>String(c||'').toLowerCase().trim());
  for(const a of aliases){
    const idx = norm.findIndex(c=> c.includes(a));
    if(idx !== -1) return idx;
  }
  return -1;
}

function importRkasFile(file){
  readSheetRows(file, rows=>{
    const hIdx = findHeaderRow(rows, ['kode rekening','uraian','vol','harga satuan','jumlah']);
    const header = rows[hIdx];
    const dataRows = rows.slice(hIdx+1).filter(r=> r.some(c=>String(c||'').trim()!==''));

    const cKode = colIndexFor(header,['kode rekening']);
    const cUraian = colIndexFor(header,['uraian']);
    const cVol = colIndexFor(header,['vol']);
    const cSatuan = colIndexFor(header,['satuan']);
    const cHarga = colIndexFor(header,['harga satuan']);
    const cJumlah = colIndexFor(header,['jumlah']);
    const cTw1 = colIndexFor(header,['triwulan 1']);
    const cTw2 = colIndexFor(header,['triwulan 2']);
    const cTw3 = colIndexFor(header,['triwulan 3']);
    const cTw4 = colIndexFor(header,['triwulan 4']);
    const hasTriwulan = cTw1!==-1 || cTw2!==-1 || cTw3!==-1 || cTw4!==-1;

    let count = 0;
    dataRows.forEach(r=>{
      const kode = cKode!==-1? String(r[cKode]||'').trim() : '';
      const uraian = cUraian!==-1? String(r[cUraian]||'').trim() : '';
      if(!kode && !uraian) return;
      const volume = cVol!==-1? toNumber(r[cVol]) : 1;
      const satuan = cSatuan!==-1? String(r[cSatuan]||'').trim() : '';
      const harga = cHarga!==-1? toNumber(r[cHarga]) : 0;
      const totalJumlah = cJumlah!==-1? toNumber(r[cJumlah]) : volume*harga;

      if(hasTriwulan){
        const twPercents = [
          {label:'I', val:cTw1!==-1? toNumber(r[cTw1]):0},
          {label:'II', val:cTw2!==-1? toNumber(r[cTw2]):0},
          {label:'III', val:cTw3!==-1? toNumber(r[cTw3]):0},
          {label:'IV', val:cTw4!==-1? toNumber(r[cTw4]):0}
        ].filter(t=>t.val>0);
        if(twPercents.length===0){
          DB.rkas.push({id:uid(),kode,uraian,sumber:'BOS Reguler',volume,satuan,harga,jumlah:totalJumlah,triwulan:'I'});
          count++;
        } else {
          twPercents.forEach(t=>{
            const pct = t.val<=1? t.val*100 : t.val; // handle 0.5 or 50
            DB.rkas.push({id:uid(),kode,uraian,sumber:'BOS Reguler',volume,satuan,harga,jumlah:Math.round(totalJumlah*pct/100),triwulan:t.label});
            count++;
          });
        }
      } else {
        DB.rkas.push({id:uid(),kode,uraian,sumber:'BOS Reguler',volume,satuan,harga,jumlah:totalJumlah,triwulan:'I'});
        count++;
      }
    });
    saveDB();
    document.getElementById('importRkasStatus').textContent = `Berhasil impor ${count} baris RKAS.`;
    toast(`Impor RKAS selesai: ${count} baris ditambahkan.`);
    render();
  });
}

function importBkuFile(file){
  readSheetRows(file, rows=>{
    const hIdx = findHeaderRow(rows, ['tanggal','uraian','penerimaan','pengeluaran']);
    const header = rows[hIdx];
    const dataRows = rows.slice(hIdx+1).filter(r=> r.some(c=>String(c||'').trim()!==''));

    const cTgl = colIndexFor(header,['tanggal']);
    const cBukti = colIndexFor(header,['no bukti','no. bukti','nomor bukti']);
    const cKode = colIndexFor(header,['kode rekening']);
    const cUraian = colIndexFor(header,['uraian']);
    const cMasuk = colIndexFor(header,['penerimaan']);
    const cKeluar = colIndexFor(header,['pengeluaran']);
    const cPenerima = colIndexFor(header,['penerima']);

    let count = 0, skipped = 0;
    dataRows.forEach(r=>{
      const uraian = cUraian!==-1? String(r[cUraian]||'').trim() : '';
      const masuk = cMasuk!==-1? toNumber(r[cMasuk]) : 0;
      const keluar = cKeluar!==-1? toNumber(r[cKeluar]) : 0;
      if(!uraian || (masuk===0 && keluar===0)){ skipped++; return; }
      const tanggal = cTgl!==-1? parseIndoDate(r[cTgl]) : '';
      const uraianLower = uraian.toLowerCase();
      let metode = 'tunai';
      if(uraianLower.includes('bank') || uraianLower.includes('transfer')) metode = 'bank';
      const tipe = masuk>0 ? 'masuk' : 'keluar';
      const bruto = masuk>0 ? masuk : keluar;
      DB.transaksi.push({
        id:uid(), tanggal, noBukti: cBukti!==-1? String(r[cBukti]||'').trim(): '', uraian,
        kodeRekening: cKode!==-1? String(r[cKode]||'').trim(): '',
        jenisPembayaran: metode, tipe, jumlahBruto: bruto,
        pajak:{jenis:'Tidak dipungut', persen:0, nominal:0},
        jumlahNetto: bruto,
        penerima: cPenerima!==-1? String(r[cPenerima]||'').trim(): ''
      });
      count++;
    });
    saveDB();
    document.getElementById('importBkuStatus').textContent = `Berhasil impor ${count} transaksi BKU. (${skipped} baris dilewati karena kosong)`;
    toast(`Impor BKU selesai: ${count} transaksi ditambahkan.`);
    render();
  });
}

function downloadFile(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
