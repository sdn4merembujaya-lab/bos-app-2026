<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPERBOS — Sistem Pertanggungjawaban Dana BOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  @page{
    size: A4 portrait;
    margin: 12mm;
  }

  :root{
    --navy:#173254;
    --navy-deep:#0e2138;
    --gold:#b8862f;
    --gold-light:#e8c674;
    --paper:#f6f4ef;
    --paper-card:#ffffff;
    --ink:#1f2937;
    --ink-soft:#5b6472;
    --line:#dfdbd0;
    --green:#2f7a4b;
    --red:#a83b2b;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Lora',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  /* Layout */
  #app{display:flex;min-height:100vh;}
  #sidebar{
    width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#eef2f6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  #sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
  #sidebar .brand .mark{font-family:'Lora',serif;font-weight:700;font-size:20px;letter-spacing:.3px;color:#fff;}
  #sidebar .brand .sub{font-size:11px;color:var(--gold-light);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
  #sidebar nav{padding:10px 0;flex:1;}
  .navgroup-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#8ea3ba;padding:14px 20px 6px;}
  .navbtn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    color:#d7e1ec;padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid transparent;
  }
  .navbtn:hover{background:rgba(255,255,255,.06);}
  .navbtn.active{background:rgba(184,134,47,.16);border-left:3px solid var(--gold);color:#fff;font-weight:600;}
  .navbtn .ic{width:16px;text-align:center;opacity:.85;}
  #sidebar .foot{padding:14px 20px;font-size:10.5px;color:#7d90a6;border-top:1px solid rgba(255,255,255,.1);}

  #main{flex:1;min-width:0;padding:28px 34px 60px;}
  .pagehead{margin-bottom:22px;}
  .pagehead .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:600;}
  .pagehead h1{font-size:26px;margin:4px 0 4px;color:var(--navy-deep);}
  .pagehead p{margin:0;color:var(--ink-soft);font-size:13.5px;}

  .card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h2{font-size:16px;margin:0 0 14px;color:var(--navy-deep);}
  .card h3{font-size:14px;margin:0 0 10px;color:var(--navy);}

  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  .stat{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;border-top:3px solid var(--gold);}
  .stat .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .stat .val{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;color:var(--navy-deep);margin-top:4px;}
  .stat.pos{border-top-color:var(--green);}
  .stat.neg{border-top-color:var(--red);}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:0 0 4px;}
  input,select,textarea{
    width:100%;padding:8px 10px;border:1px solid #cfcabb;border-radius:4px;font-family:'Inter',sans-serif;
    font-size:13.5px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);border-color:var(--gold);}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:150px;}

  button{cursor:pointer;font-family:'Inter',sans-serif;}
  .btn{
    background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:4px;font-size:13px;font-weight:600;
  }
  .btn:hover{background:var(--navy-deep);}
  .btn.gold{background:var(--gold);}
  .btn.gold:hover{background:#a37728;}
  .btn.outline{background:none;border:1px solid var(--navy);color:var(--navy);}
  .btn.outline:hover{background:#eef2f7;}
  .btn.danger{background:none;border:1px solid var(--red);color:var(--red);padding:5px 10px;font-size:12px;}
  .btn.danger:hover{background:#fbecea;}
  .btn.sm{padding:5px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{background:#eef1ee;color:var(--navy-deep);text-align:left;padding:8px 9px;font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);}
  td{padding:7px 9px;border-bottom:1px solid #ece8dd;vertical-align:top;}
  tr:hover td{background:#faf9f5;}
  .num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.8px;font-weight:600;}
  .tag.tunai{background:#e7f3ea;color:var(--green);}
  .tag.bank{background:#e8eef7;color:var(--navy);}
  .tag.masuk{background:#e7f3ea;color:var(--green);}
  .tag.keluar{background:#fbeceb;color:var(--red);}

  .empty{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);}
  .hint{font-size:11.8px;color:var(--ink-soft);margin-top:3px;}
  .section-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .section-tabs button{background:none;border:none;padding:9px 14px;font-size:13px;color:var(--ink-soft);border-bottom:2px solid transparent;font-weight:600;}
  .section-tabs button.active{color:var(--navy-deep);border-bottom:2px solid var(--gold);}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;opacity:0;transform:translateY(10px);transition:.25s;}
  .toast.show{opacity:1;transform:translateY(0);}
  .letterhead{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:16px;}
  .letterhead .logo-kop{width:64px;height:64px;object-fit:contain;flex-shrink:0;}
  .letterhead .kop-text{flex:1;}
  .letterhead .sch{font-family:'Lora',serif;font-weight:700;font-size:16px;color:var(--navy-deep);}
  .letterhead .addr{font-size:11.5px;color:var(--ink-soft);}
  .modal-bg{position:fixed;inset:0;background:rgba(14,33,56,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:200;}
  .modal{background:#fff;border-radius:8px;padding:22px;max-width:560px;width:100%;}
  .modal h3{margin-top:0;}
  .closex{float:right;background:none;border:none;font-size:18px;color:var(--ink-soft);}

  /* Blok tanda tangan (kwitansi, nota, SPPD, surat tugas, laporan) —
     dipisah agar bisa dipaksa tetap 3 kolom saat cetak potrait */
  .ttd-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px;text-align:center;}
  .ttd-row.ttd-2{grid-template-columns:repeat(2,1fr);}
  .ttd-row .ttd-slot{padding:0 6px;}
  .ttd-row .ttd-gap{height:64px;}

  /* Kop judul bergradasi biru untuk dokumen BAST / Invoice / SPK, meniru format resmi ARKAS/SIPLah */
  .doc-title-bar{background:linear-gradient(90deg,var(--navy) 0%,#5f8db3 100%);color:#fff;font-weight:700;font-size:17px;letter-spacing:.02em;padding:10px 16px;border-radius:3px;margin-bottom:16px;}
  .doc-info-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12.8px;}
  .doc-info-table td{border:1px solid #b9c2cc;padding:6px 8px;vertical-align:top;}
  .doc-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .doc-table th,.doc-table td{border:1px solid #7a8593;padding:5px 8px;}
  .doc-table th{background:#e9edf1;font-weight:700;text-transform:none;letter-spacing:0;}
  .doc-table td.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .doc-total-box{background:var(--navy);color:#fff;font-weight:700;font-size:19px;padding:8px 20px;display:inline-block;border-radius:3px;}

  @media print{
    #sidebar,.no-print{display:none!important;}
    #main{padding:0;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;}
    #main > *:not(.print-target){display:none!important;}

    /* Paksa grid tetap sejajar horizontal saat dicetak — tanpa ini,
       lebar kertas potrait (<900px) memicu breakpoint mobile yang
       menumpuk kolom tanda tangan secara vertikal. */
    .grid-3,.ttd-row{grid-template-columns:repeat(3,1fr)!important;}
    .grid-2,.ttd-row.ttd-2{grid-template-columns:repeat(2,1fr)!important;}
    .grid-4{grid-template-columns:repeat(4,1fr)!important;}
    .grid-3,.grid-2,.grid-4,.ttd-row{gap:8px!important;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">SIPERBOS</div>
      <div class="sub">Pertanggungjawaban Dana BOS</div>
    </div>
    <nav id="navlist"></nav>
    <div class="foot" id="sidebarFoot">Data tersimpan lokal di perangkat ini.<br>v2.1 · format ARKAS (RKAS/RPD/BKU)</div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>

<script>
/* ============ DATA LAYER (localStorage) ============ */
const DB_KEY = 'siperbos_v2';
const defaultDB = {
  profil:{ namaSekolah:'SD NEGERI 4 MEREMBUJAYA', npsn:'', alamat:'', desa:'', kecamatan:'Labuapi', kabupaten:'Lombok Barat', pemerintahKab:'PEMERINTAH KABUPATEN LOMBOK BARAT', dinas:'DINAS PENDIDIKAN DAN KEBUDAYAAN', kodePos:'', kepsek:'Darmawan, S.Pd', nipKepsek:'', bendahara:'Maemunah, S.Pd', nipBendahara:'', tahunAnggaran:'2026', logoKab:'', logoSekolah:'' },
  penerimaan: [],
  rkas: [],
  transaksi: [], // BKU: {id,tanggal,noBukti,uraian,kodeRekening,namaRekening,programKegiatanSNP,sumberDana,jenisPembayaran(tunai/bank),tipe(masuk/keluar),jumlahBruto,pajak:{jenis,persen,nominal},jumlahNetto,penerima}
  kwitansi: [],
  notaPesanan: [],
  bast: [],
  invoice: [],
  spk: [],
  sppd: [],
  suratTugas: [],
  checklistSpj: [],
  rekonsiliasi: [],
  auth: {
    admin:{ username:'admin', password:'admin123', nama:'Administrator' },
    bendahara:{ username:'bendahara', password:'bendahara123', nama:'Bendahara BOS' }
  }
};
function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); if(!raw) return structuredClone(defaultDB); const d = JSON.parse(raw); return {...structuredClone(defaultDB), ...d}; }
  catch(e){ return structuredClone(defaultDB); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
let DB = loadDB();
if(!DB.auth){ DB.auth = structuredClone(defaultDB.auth); saveDB(); }
if(DB.profil.logoSekolah===undefined){ DB.profil.logoSekolah=''; }
if(DB.profil.logoKab===undefined){ DB.profil.logoKab=''; }

/* ============ AUTH / LOGIN ============ */
const SESSION_KEY = 'siperbos_session';
function getSession(){ try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function setSession(role){ sessionStorage.setItem(SESSION_KEY, JSON.stringify({role, at:Date.now()})); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }
let currentSession = getSession();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtRp(n){ n = Number(n)||0; return 'Rp ' + n.toLocaleString('id-ID'); }
function fmtDate(d){ if(!d) return '-'; const dt = new Date(d); return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function optSel(val, current){ return val===current ? ' selected' : ''; }
/* Lokasi untuk baris tanda tangan: "Desa, Kabupaten" jika desa diisi, kalau tidak pakai Kabupaten saja */
function lokasiTtd(){
  const p = DB.profil;
  return p.desa ? (p.desa + (p.kabupaten? ', '+p.kabupaten : '')) : (p.kabupaten||'');
}

/* Preset jenis kegiatan -> jenis pajak & persentase (acuan umum, bisa disesuaikan) */
const PAJAK_PRESET = {
  'Honorarium (Non-PNS)':      {jenis:'PPh 21 Final', persen:5},
  'Honorarium (PNS Gol III/IV)':{jenis:'PPh 21 Final', persen:5},
  'Belanja Barang/Jasa (Rekanan PKP)': {jenis:'PPN', persen:11},
  'Belanja Barang (Non PKP < 2jt)': {jenis:'Tidak dipungut', persen:0},
  'Jasa Tukang/Perorangan':    {jenis:'PPh 21 Final', persen:2.5},
  'Jasa Pelatih Ekstrakurikuler': {jenis:'PPh 21 Final', persen:5},
  'Sewa (PPh 4 ayat 2)':       {jenis:'PPh Final Sewa', persen:10},
  'Belanja Jasa Badan (PPh 23)': {jenis:'PPh 23', persen:2},
  'Langganan Daya & Jasa':     {jenis:'Tidak dipungut', persen:0},
  'Perjalanan Dinas':          {jenis:'Tidak dipungut', persen:0},
  'Lainnya (manual)':          {jenis:'Manual', persen:0}
};

/* 8 Standar Nasional Pendidikan yang dipakai ARKAS sebagai "Program Kegiatan SNP" */
const STANDAR_SNP = [
  'Standar Kompetensi Lulusan','Standar Isi','Standar Proses','Standar Penilaian Pendidikan',
  'Standar Tenaga Kependidikan','Standar Sarana dan Prasarana','Standar Pengelolaan','Standar Pembiayaan','Lainnya'
];

/* ============ NAV ============ */
const NAV = [
  {group:'Ringkasan', items:[
    {id:'dasbor', label:'Dasbor', ic:'◆'}
  ]},
  {group:'Data Dasar', items:[
    {id:'profil', label:'Profil Sekolah', ic:'▤'},
    {id:'penerimaan', label:'Penerimaan Dana', ic:'⬇'},
    {id:'rkas', label:'RPD & Kode Rekening', ic:'▦'}
  ]},
  {group:'Penatausahaan', items:[
    {id:'bku', label:'Buku Kas Umum', ic:'✎'},
    {id:'pembantu', label:'Buku Pembantu', ic:'▥'},
    {id:'dokumen', label:'Kwitansi, Nota & Surat', ic:'▧'}
  ]},
  {group:'Pelaporan', items:[
    {id:'checklist', label:'Checklist SPJ', ic:'☑'},
    {id:'laporan', label:'Laporan & Cetak', ic:'▣'}
  ]},
  {group:'Utilitas', items:[
    {id:'akun', label:'Pengaturan Akun', ic:'●'},
    {id:'backup', label:'Cadangkan Data', ic:'⟳'}
  ]}
];
let currentPage = 'dasbor';
let penerimaanEditingId = null;
let rkasEditingId = null;
let transaksiEditingId = null;
let sppdEditingId = null;
let suratTugasEditingId = null;

function renderNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = NAV.map(g=>`
    <div class="navgroup-label">${g.group}</div>
    ${g.items.map(it=>`<button class="navbtn ${currentPage===it.id?'active':''}" data-page="${it.id}"><span class="ic">${it.ic}</span>${it.label}</button>`).join('')}
  `).join('');
  nav.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{ currentPage=b.dataset.page; render(); }));
  const foot = document.getElementById('sidebarFoot');
  if(foot && currentSession){
    const acc = DB.auth[currentSession.role];
    foot.innerHTML = `Masuk sebagai <b style="color:#fff;">${acc?acc.nama:currentSession.role}</b> (${currentSession.role})<br>
    <button class="btn sm outline" id="btnLogout" style="margin-top:8px;color:#fff;border-color:rgba(255,255,255,.4);">Keluar</button>`;
    setTimeout(()=>{ const bl = document.getElementById('btnLogout'); if(bl) bl.addEventListener('click', doLogout); },0);
  }
}

/* ============ RENDER ROUTER ============ */
function render(){
  currentSession = getSession();
  if(!currentSession){ renderLogin(); return; }
  document.getElementById('app').style.display = 'flex';
  renderNav();
  const main = document.getElementById('main');
  const pages = { dasbor:pageDasbor, profil:pageProfil, penerimaan:pagePenerimaan, rkas:pageRkas, bku:pageBKU, pembantu:pagePembantu, dokumen:pageDokumen, checklist:pageChecklist, laporan:pageLaporan, backup:pageBackup, akun:pageAkun };
  main.innerHTML = pages[currentPage] ? pages[currentPage]() : '<div class="empty">Halaman tidak ditemukan</div>';
  attachPageEvents();
}

function renderLogin(){
  document.getElementById('app').style.display = 'none';
  let box = document.getElementById('loginBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'loginBox';
    document.body.appendChild(box);
  }
  box.innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%, var(--navy-deep) 100%);">
    <div style="background:#fff;border-radius:10px;padding:34px 32px;max-width:380px;width:92%;box-shadow:0 20px 50px rgba(0,0,0,.35);">
      <div style="text-align:center;margin-bottom:18px;">
        <div class="serif" style="font-weight:700;font-size:22px;color:var(--navy-deep);">SIPERBOS</div>
        <div style="font-size:11.5px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;">Masuk ke Aplikasi</div>
      </div>
      <div class="field"><label>Peran</label>
        <select id="login_role"><option value="admin">Admin</option><option value="bendahara">Bendahara</option></select>
      </div>
      <div class="field"><label>Username</label><input id="login_username" placeholder="username"></div>
      <div class="field"><label>Kata Sandi</label><input type="password" id="login_password" placeholder="kata sandi"></div>
      <div id="loginError" style="color:var(--red);font-size:12.5px;margin-bottom:8px;"></div>
      <button class="btn gold" id="btnLogin" style="width:100%;">Masuk</button>
    <div class="hint" style="text-align:center;margin-top:14px;"> © 2026 DEE 4 MEREMBU  • All Rights Reserved </div>
    </div>
  </div>`;
  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('login_password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
function doLogin(){
  const role = document.getElementById('login_role').value;
  const u = document.getElementById('login_username').value.trim();
  const pw = document.getElementById('login_password').value;
  const acc = DB.auth[role];
  if(acc && acc.username === u && acc.password === pw){
    setSession(role);
    document.getElementById('loginBox').remove();
    render();
  } else {
    document.getElementById('loginError').textContent = 'Username atau kata sandi salah.';
  }
}
function doLogout(){
  clearSession();
  render();
}

function head(eyebrow,title,desc){
  return `<div class="pagehead"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>`;
}

/* ============ HELPERS: RKAS <-> BKU realisasi ============ */
function rkasByKodeMap(){
  const map = {};
  DB.rkas.forEach(r=>{ if(r.kode) map[r.kode] = r; });
  return map;
}
function realisasiForKode(kode){
  if(!kode) return 0;
  return DB.transaksi.filter(t=>t.tipe==='keluar' && t.kodeRekening===kode).reduce((s,t)=>s+Number(t.jumlahBruto||0),0);
}
function twAmt(r, n){ return Math.round(Number(r.jumlah||0) * Number(r['tw'+n+'Pct']||0) / 100); }
/* Jumlah realisasi di BKU untuk kode rekening yang terkait dengan sebuah Nota Pesanan (mengikuti data BKU yang sudah diupload/diinput) */
function notaRealisasiBku(n){
  const kodes = new Set();
  (n.sourceRkasIds||[]).forEach(id=>{
    const item = DB.rkas.find(r=>r.id===id);
    if(item && item.kode) kodes.add(item.kode);
  });
  let total = 0;
  kodes.forEach(k=> total += realisasiForKode(k));
  return total;
}
function computeRealisasiPerKomponen(){
  const map = {};
  DB.rkas.forEach(r=>{
    const k = r.programKegiatanSNP || 'Lainnya';
    if(!map[k]) map[k] = {komponen:k, anggaran:0, realisasi:0};
    map[k].anggaran += Number(r.jumlah||0);
  });
  const byKode = rkasByKodeMap();
  DB.transaksi.filter(t=>t.tipe==='keluar').forEach(t=>{
    const item = t.kodeRekening ? byKode[t.kodeRekening] : null;
    const k = item ? (item.programKegiatanSNP||'Lainnya') : (t.programKegiatanSNP || 'Belum Terklasifikasi');
    if(!map[k]) map[k] = {komponen:k, anggaran:0, realisasi:0};
    map[k].realisasi += Number(t.jumlahBruto||0);
  });
  return Object.values(map).map(x=>({...x, sisa:x.anggaran-x.realisasi}));
}

/* ============ DASBOR ============ */
function pageDasbor(){
  const totalPenerimaan = DB.penerimaan.reduce((s,p)=>s+Number(p.jumlah||0),0);
  const totalMasuk = DB.transaksi.filter(t=>t.tipe==='masuk').reduce((s,t)=>s+Number(t.jumlahNetto||0),0);
  const totalKeluar = DB.transaksi.filter(t=>t.tipe==='keluar').reduce((s,t)=>s+Number(t.jumlahNetto||0),0);
  const saldoTunai = DB.transaksi.filter(t=>t.jenisPembayaran==='tunai').reduce((s,t)=> s + (t.tipe==='masuk'?Number(t.jumlahNetto||0):-Number(t.jumlahNetto||0)),0);
  const saldoBank = DB.transaksi.filter(t=>t.jenisPembayaran==='bank').reduce((s,t)=> s + (t.tipe==='masuk'?Number(t.jumlahNetto||0):-Number(t.jumlahNetto||0)),0);
  const totalPajak = DB.transaksi.reduce((s,t)=> s + Number(t.pajak?.nominal||0),0);
  const totalRKAS = DB.rkas.reduce((s,r)=>s+Number(r.jumlah||0),0);

  const recent = [...DB.transaksi].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal)).slice(0,6);
  const komponen = computeRealisasiPerKomponen().sort((a,b)=>b.anggaran-a.anggaran);

  return `
  ${head('SDN 4 Merembujaya','Dasbor','Ringkasan keuangan dana BOS tahun anggaran '+ (DB.profil.tahunAnggaran||'-'))}
  <div class="grid grid-4">
    <div class="stat pos"><div class="lbl">Total Penerimaan Dana</div><div class="val">${fmtRp(totalPenerimaan)}</div></div>
    <div class="stat"><div class="lbl">Total Anggaran RPD</div><div class="val">${fmtRp(totalRKAS)}</div></div>
    <div class="stat neg"><div class="lbl">Total Pengeluaran BKU</div><div class="val">${fmtRp(totalKeluar)}</div></div>
    <div class="stat"><div class="lbl">Pajak Terpotong</div><div class="val">${fmtRp(totalPajak)}</div></div>
  </div>
  <div class="grid grid-2" style="margin-top:4px;">
    <div class="stat"><div class="lbl">Saldo Kas Tunai</div><div class="val">${fmtRp(saldoTunai)}</div></div>
    <div class="stat"><div class="lbl">Saldo Kas Bank</div><div class="val">${fmtRp(saldoBank)}</div></div>
  </div>
  <div class="card" style="margin-top:18px;">
    <h2>Realisasi per Komponen Kegiatan (Program SNP)</h2>
    ${komponen.length===0?'<div class="empty">Belum ada data RPD/BKU untuk dibandingkan.</div>':`
    <table><thead><tr><th>Komponen</th><th class="num">Anggaran</th><th class="num">Realisasi</th><th class="num">Sisa</th></tr></thead>
    <tbody>${komponen.map(k=>`<tr><td>${k.komponen}</td><td class="num">${fmtRp(k.anggaran)}</td><td class="num">${fmtRp(k.realisasi)}</td><td class="num">${fmtRp(k.sisa)}</td></tr>`).join('')}</tbody></table>`}
  </div>
  <div class="card">
    <h2>Transaksi Terbaru</h2>
    ${recent.length===0?'<div class="empty">Belum ada transaksi BKU. Mulai input di menu Buku Kas Umum, atau impor file BKU.</div>':`
    <table><thead><tr><th>Tanggal</th><th>Uraian</th><th>Jenis</th><th>Metode</th><th class="num">Netto</th></tr></thead>
    <tbody>${recent.map(t=>`<tr><td>${fmtDate(t.tanggal)}</td><td>${t.uraian}</td><td><span class="tag ${t.tipe==='masuk'?'masuk':'keluar'}">${t.tipe==='masuk'?'Masuk':'Keluar'}</span></td><td><span class="tag ${t.jenisPembayaran}">${t.jenisPembayaran==='tunai'?'Tunai':'Bank'}</span></td><td class="num">${fmtRp(t.jumlahNetto)}</td></tr>`).join('')}</tbody></table>`}
  </div>`;
}

/* ============ BKU ============ */
function pageBKU(){
  const rows = [...DB.transaksi].sort((a,b)=> new Date(a.tanggal)-new Date(b.tanggal));
  const editing = transaksiEditingId ? DB.transaksi.find(t=>t.id===transaksiEditingId) : null;
  let saldo = 0;
  const rowsHtml = rows.map(t=>{
    saldo += (t.tipe==='masuk'? Number(t.jumlahNetto||0) : -Number(t.jumlahNetto||0));
    return `<tr>
      <td>${fmtDate(t.tanggal)}</td><td class="mono">${t.noBukti||'-'}</td><td>${t.uraian}${t.penerima?'<div class="hint">Penerima: '+t.penerima+'</div>':''}</td>
      <td class="mono">${t.kodeRekening||'-'}</td><td>${t.programKegiatanSNP||'-'}</td>
      <td><span class="tag ${t.jenisPembayaran}">${t.jenisPembayaran==='tunai'?'Tunai':'Bank'}</span></td>
      <td class="num">${t.tipe==='masuk'?fmtRp(t.jumlahBruto):'-'}</td>
      <td class="num">${t.tipe==='keluar'?fmtRp(t.jumlahBruto):'-'}</td>
      <td class="num">${t.pajak && t.pajak.nominal? fmtRp(t.pajak.nominal)+' ('+t.pajak.jenis+')':'-'}</td>
      <td class="num">${fmtRp(saldo)}</td>
      <td class="no-print"><button class="btn sm outline" data-edit-transaksi="${t.id}">Edit</button> <button class="btn danger" data-del-transaksi="${t.id}">Hapus</button></td>
    </tr>`;
  }).join('');

  const rkasOptions = DB.rkas.map(r=>`<option value="${r.kode}"${optSel(r.kode, editing?editing.kodeRekening:'')}>${r.kode} — ${r.uraian}</option>`).join('');
  let presetKeySelected = '';
  if(editing && editing.pajak){
    presetKeySelected = Object.keys(PAJAK_PRESET).find(k=> PAJAK_PRESET[k].jenis===editing.pajak.jenis && PAJAK_PRESET[k].persen===editing.pajak.persen) || 'Lainnya (manual)';
  }
  const presetOptions = Object.keys(PAJAK_PRESET).map(k=>`<option value="${k}"${optSel(k, presetKeySelected)}>${k}</option>`).join('');

  return `
  ${head('Penatausahaan','Buku Kas Umum (BKU)','Semua transaksi kas masuk & keluar, pajak dihitung otomatis berdasarkan jenis kegiatan.')}
  <div class="card no-print">
    <h2>Impor dari File BKU (Excel)</h2>
    <p class="hint">Mendukung file BKU resmi ARKAS/SIPLah (sheet bernama <b>BKU</b>). Kolom yang dikenali: Tanggal, No Bukti, Program Kegiatan SNP, Kode Rekening, Nama Rekening, Uraian, Penerimaan, Pengeluaran, Penerima. Baris "SALDO AWAL" otomatis dilewati. Metode (tunai/bank) ditebak dari kata di Uraian/Nama Rekening — bisa diedit lagi setelah impor.</p>
    <input type="file" id="fileImportBku" accept=".xlsx,.xls,.csv">
    <br><br>
    <button class="btn outline" id="btnImportBku">Impor File BKU</button>
    <div id="importBkuStatus" class="hint"></div>
  </div>
  <div class="card">
    <h2>${editing?'Edit Transaksi':'Input Transaksi'}</h2>
    <div class="row">
      <div class="field"><label>Tanggal</label><input type="date" id="t_tanggal" value="${editing?editing.tanggal:''}"></div>
      <div class="field"><label>No. Bukti</label><input id="t_bukti" placeholder="BPU-001" value="${editing?(editing.noBukti||''):''}"></div>
      <div class="field"><label>Tipe</label>
        <select id="t_tipe">
          <option value="keluar"${optSel('keluar', editing?editing.tipe:'keluar')}>Pengeluaran</option>
          <option value="masuk"${optSel('masuk', editing?editing.tipe:'keluar')}>Penerimaan (non-dana awal)</option>
        </select>
      </div>
      <div class="field"><label>Metode</label>
        <select id="t_metode">
          <option value="tunai"${optSel('tunai', editing?editing.jenisPembayaran:'tunai')}>Tunai</option>
          <option value="bank"${optSel('bank', editing?editing.jenisPembayaran:'tunai')}>Bank</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Uraian</label><input id="t_uraian" placeholder="mis. Pembelian ATK bulan Agustus" value="${editing?editing.uraian:''}"></div>
    <div class="row">
      <div class="field"><label>Kode Rekening (RPD)</label>
        <select id="t_kode"><option value="">— pilih (opsional) —</option>${rkasOptions}</select>
      </div>
      <div class="field"><label>Jenis Kegiatan (untuk hitung pajak)</label>
        <select id="t_jenisKegiatan">${presetOptions}</select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Jumlah Bruto (Rp)</label><input type="number" id="t_jumlah" placeholder="0" value="${editing?editing.jumlahBruto:''}"></div>
      <div class="field"><label>Persentase Pajak Manual (%)</label><input type="number" id="t_pajakManual" placeholder="isi jika pilih 'Lainnya (manual)'" step="0.1" value="${editing&&editing.pajak?editing.pajak.persen:''}"></div>
      <div class="field"><label>Penerima / Dibayarkan Kepada</label><input id="t_penerima" placeholder="nama toko/perorangan" value="${editing?(editing.penerima||''):''}"></div>
    </div>
    <div class="hint" id="t_pajakPreview">Nominal pajak akan dihitung otomatis saat disimpan.</div>
    <br>
    <button class="btn gold" id="btnAddTransaksi">${editing?'Perbarui Transaksi':'Simpan Transaksi'}</button>
    ${editing?' <button class="btn outline" id="btnCancelTransaksi">Batal Edit</button>':''}
  </div>
  <div class="card">
    <h2>Rekap Buku Kas Umum</h2>
    ${rows.length===0?'<div class="empty">Belum ada transaksi.</div>':`
    <div style="overflow-x:auto;">
    <table><thead><tr><th>Tgl</th><th>No.Bukti</th><th>Uraian</th><th>Kode Rek.</th><th>Program SNP</th><th>Metode</th><th class="num">Penerimaan</th><th class="num">Pengeluaran</th><th class="num">Pajak</th><th class="num">Saldo</th><th class="no-print"></th></tr></thead>
    <tbody>${rowsHtml}</tbody></table>
    </div>`}
  </div>`;
}

/* ============ BUKU PEMBANTU ============ */

    {id:'bank', label:'Buku Pembantu Bank'},
    {id:'pajak', label:'Buku Pembantu Pajak'}

/* ============ TERBILANG ============ */
const SATUAN_KATA = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function terbilangInt(n){
  n = Math.floor(n);
  if(n < 12) return SATUAN_KATA[n];
  if(n < 20) return terbilangInt(n-10)+' belas';
  if(n < 100) return terbilangInt(Math.floor(n/10))+' puluh'+(n%10?' '+terbilangInt(n%10):'');
  if(n < 200) return 'seratus'+(n%100?' '+terbilangInt(n%100):'');
  if(n < 1000) return terbilangInt(Math.floor(n/100))+' ratus'+(n%100?' '+terbilangInt(n%100):'');
  if(n < 2000) return 'seribu'+(n%1000?' '+terbilangInt(n%1000):'');
  if(n < 1000000) return terbilangInt(Math.floor(n/1000))+' ribu'+(n%1000?' '+terbilangInt(n%1000):'');
  if(n < 1000000000) return terbilangInt(Math.floor(n/1000000))+' juta'+(n%1000000?' '+terbilangInt(n%1000000):'');
  return terbilangInt(Math.floor(n/1000000000))+' milyar'+(n%1000000000?' '+terbilangInt(n%1000000000):'');
}
function terbilang(n){
  n = Math.round(Number(n)||0);
  if(n===0) return 'nol rupiah';
  const words = terbilangInt(n).replace(/\s+/g,' ').trim();
  return words.charAt(0).toUpperCase()+words.slice(1)+' rupiah';
}

/* Peta index item checklist -> jenis dokumen yang bisa dideteksi otomatis dari data
   yang sudah dibuat di menu "Kwitansi, Nota & Surat". Item ini akan tercentang sendiri
   begitu dokumen yang cocok (berdasarkan kemiripan keterangan kegiatan) sudah dibuat. */
const SPJ_AUTO_LINK = {
  'Honorarium Pendidik dan Tenaga Kependidikan Non ASN': {0:'kwitansi'},
  'Perjalanan Dinas': {0:'kwitansi', 2:'sppd', 4:'suratTugas'},
  'Pembelian Makanan dan Minuman': {0:'kwitansi'},
  'Belanja Pengadaan Barang': {1:'kwitansi', 4:'nota'},
  'Jasa Tukang/Ongkos Tukang': {0:'kwitansi'},
  'Jasa Pelatih Ekstrakurikuler': {0:'kwitansi'},
  'Pendaftaran Lomba-Lomba': {0:'kwitansi'},
  'Jasa Retribusi/Pengangkutan Sampah': {0:'kwitansi'},
  'Langganan Daya dan Jasa (Listrik/Air/Indihome)': {0:'kwitansi'},
  'Paket Data dan Langganan Koran': {0:'kwitansi'},
  'Sewa': {0:'kwitansi'}
};
const SPJ_AUTO_LABEL = {kwitansi:'Kwitansi', sppd:'SPPD', suratTugas:'Surat Tugas', nota:'Nota Pesanan'};

function normalisasiTeks(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function skorKemiripan(a,b){
  const wa = new Set(normalisasiTeks(a).split(' ').filter(w=>w.length>=4));
  const wb = new Set(normalisasiTeks(b).split(' ').filter(w=>w.length>=4));
  if(wa.size===0 || wb.size===0) return 0;
  let sama = 0;
  wa.forEach(w=>{ if(wb.has(w)) sama++; });
  return sama;
}
/* Cari dokumen (kwitansi/SPPD/surat tugas/nota) yang paling cocok dengan keterangan checklist */
function cariDokumenCocok(jenis, uraian){
  if(!uraian) return null;
  let kandidat = [];
  if(jenis==='kwitansi') kandidat = DB.kwitansi.map(d=>({doc:d, teks:d.untuk}));
  else if(jenis==='sppd') kandidat = DB.sppd.map(d=>({doc:d, teks:d.maksud}));
  else if(jenis==='suratTugas') kandidat = DB.suratTugas.map(d=>({doc:d, teks:d.tugas}));
  else if(jenis==='nota') kandidat = DB.notaPesanan.map(d=>({doc:d, teks:(d.kepada||'')+' '+(d.items||[]).map(i=>i.nama).join(' ')}));
  let terbaik = null, skorTerbaik = 0;
  kandidat.forEach(k=>{
    const skor = skorKemiripan(uraian, k.teks);
    if(skor > skorTerbaik){ skorTerbaik = skor; terbaik = k.doc; }
  });
  return skorTerbaik > 0 ? terbaik : null;
}
/* Status satu baris checklist: otomatis (terdeteksi dari dokumen) atau manual (dicentang sendiri) */
function statusItemChecklist(c, idx){
  const jenis = (SPJ_AUTO_LINK[c.kategori]||{})[idx];
  if(jenis){
    const match = cariDokumenCocok(jenis, c.uraian);
    if(match) return {checked:true, otomatis:true, jenis, match};
    return {checked:!!(c.items[idx]&&c.items[idx].checked), otomatis:false, jenis, match:null};
  }
  return {checked:!!(c.items[idx]&&c.items[idx].checked), otomatis:false, jenis:null, match:null};
}

      <table><tbody>
        ${c.items.map((it,idx)=>{
          const st = statuses[idx];
          if(st.otomatis){
            return `<tr><td style="width:30px;">✅</td><td>${it.text} <span class="tag masuk" style="margin-left:6px;">Otomatis — ${SPJ_AUTO_LABEL[st.jenis]}${st.match.nomor?(' '+st.match.nomor):''}</span></td></tr>`;
          }
          const petunjuk = st.jenis ? `<div class="hint">Akan tercentang otomatis begitu ${SPJ_AUTO_LABEL[st.jenis]} dengan keterangan yang cocok dibuat di menu Kwitansi, Nota & Surat.</div>` : '';
          return `<tr><td style="width:30px;"><input type="checkbox" data-checklist-item="${c.id}|${idx}" ${it.checked?'checked':''}></td><td>${it.text}${petunjuk}</td></tr>`;
        }).join('')}
      </tbody></table>
      <div class="no-print" style="margin-top:10px;"><button class="btn danger" data-del-checklist="${c.id}">Hapus Checklist</button></div>
    </div>`;
  }).join('')}`;
}

      <div class="ttd-slot">Bendahara BOS
        <div class="ttd-gap"></div>
        <b>${p.bendahara||'( ______________ )'}</b><br>NIP. ${p.nipBendahara||'-'}</div>
      <div class="ttd-slot">Kepala Sekolah
        <div class="ttd-gap"></div>
        <b>${p.kepsek||'( ______________ )'}</b><br>NIP. ${p.nipKepsek||'-'}</div>
    </div>
    <div class="no-print" style="margin-top:18px;"><button class="btn outline" onclick="window.print()">Cetak / Simpan PDF</button></div>
  </div>`;
}

  // BKU
  const jenisKegiatanSel = document.getElementById('t_jenisKegiatan');

    if(!jenisKegiatanSel) return;

      if(manualInput && !transaksiEditingId) manualInput.value = preset.persen;

    const bruto = Number(document.getElementById('t_jumlah').value||0);
    if(!tanggal || !uraian || !bruto){ toast('Isi tanggal, uraian, dan jumlah.'); return; }
    const tipe = document.getElementById('t_tipe').value;
    const metode = document.getElementById('t_metode').value;
    const kodeRekening = document.getElementById('t_kode').value;

    const jenisKegiatan = document.getElementById('t_jenisKegiatan').value;
    const preset = PAJAK_PRESET[jenisKegiatan];

    if(jenisKegiatan === 'Lainnya (manual)'){
      persen = Number(document.getElementById('t_pajakManual').value||0);
      jenisPajak = persen>0 ? 'Pajak Manual' : 'Tidak dipungut';
    }
    const nominalPajak = tipe==='keluar' ? Math.round(bruto * (persen/100)) : 0;
    const netto = tipe==='keluar' ? bruto - nominalPajak : bruto;
    const data = {
      tanggal, noBukti:document.getElementById('t_bukti').value, uraian, kodeRekening,
      namaRekening: rkasItem? rkasItem.namaReferensi : '', programKegiatanSNP: rkasItem? rkasItem.programKegiatanSNP : '',
      jenisPembayaran:metode, tipe, jumlahBruto:bruto,
      pajak: nominalPajak>0 ? {jenis:jenisPajak, persen, nominal:nominalPajak} : {jenis:jenisPajak, persen:0, nominal:0},
      jumlahNetto: netto, penerima:document.getElementById('t_penerima').value
    };
    if(transaksiEditingId){
      const idx = DB.transaksi.findIndex(t=>t.id===transaksiEditingId);
      if(idx!==-1) DB.transaksi[idx] = {...DB.transaksi[idx], ...data};

  }));

  }));

  // Kwitansi — auto-generate dari BKU
  const btnFillKwitansiFromBku = document.getElementById('btnFillKwitansiFromBku');
  if(btnFillKwitansiFromBku) btnFillKwitansiFromBku.addEventListener('click', ()=>{
    const tid = document.getElementById('k_fromBku').value;
    if(!tid){ toast('Pilih transaksi BKU terlebih dahulu.'); return; }

    if(!t) return;
    document.getElementById('k_nomor').value = t.noBukti || '';
    document.getElementById('k_tanggal').value = t.tanggal || '';
    document.getElementById('k_kodeRekening').value = t.kodeRekening || '';
    document.getElementById('k_untuk').value = t.uraian || '';
    document.getElementById('k_jumlah').value = t.jumlahBruto || '';
    document.getElementById('k_penerima').value = t.penerima || '';
    document.getElementById('k_sourceBkuId').value = t.id;
    toast('Form kwitansi diisi dari transaksi BKU.');
  });
  const btnAutoKwitansiAll = document.getElementById('btnAutoKwitansiAll');
  if(btnAutoKwitansiAll) btnAutoKwitansiAll.addEventListener('click', ()=>{
    const bkuKeluar = DB.transaksi.filter(t=>t.tipe==='keluar');
    const belum = bkuKeluar.filter(t=> !DB.kwitansi.some(k=>k.sourceBkuId===t.id));
    if(belum.length===0){ toast('Semua transaksi pengeluaran sudah memiliki kwitansi.'); return; }
    belum.forEach(t=>{
      DB.kwitansi.push({
        id:uid(), tanggal:t.tanggal, nomor: t.noBukti || ('KW-'+t.id.toUpperCase()),

    const ids = Array.from(sel.selectedOptions).map(o=>o.value);
    if(ids.length===0){ toast('Pilih minimal satu rincian RPD.'); return; }
    const items = ids.map(id=>DB.rkas.find(r=>r.id===id)).filter(Boolean);
    const itemsTextarea = document.getElementById('n_items');
    const newLines = items.map(r=>`${r.uraian} | ${r.volume} | ${r.satuan} | ${r.harga}`);
    const existing = itemsTextarea.value.trim();
    itemsTextarea.value = existing ? existing+'\n'+newLines.join('\n') : newLines.join('\n');
    const idsField = document.getElementById('n_sourceRkasIds');
    const currentIds = idsField.value ? idsField.value.split(',').filter(Boolean) : [];
    idsField.value = [...new Set([...currentIds, ...ids])].join(',');
    toast(`${items.length} item ditambahkan dari RPD.`);
  });
  const btnAutoNotaAll = document.getElementById('btnAutoNotaAll');
  if(btnAutoNotaAll) btnAutoNotaAll.addEventListener('click', ()=>{
    const rkasBelum = DB.rkas.filter(r=> !DB.notaPesanan.some(n=> (n.sourceRkasIds||[]).includes(r.id)));
    if(rkasBelum.length===0){ toast('Semua rincian RPD sudah memiliki nota pesanan.'); return; }
    // Kelompokkan rincian RPD berdasarkan Kode Rekening — semua barang dengan kode rekening
    // yang sama (mis. 5.1.02.01.01.0024 = ATK) digabung jadi satu Nota Pesanan.
    const groups = {};
    const groupOrder = [];
    rkasBelum.forEach(r=>{
      const key = r.kode || r.namaReferensi || 'lainnya';
      if(!groups[key]){ groups[key] = []; groupOrder.push(key); }
      groups[key].push(r);
    });
    let madeCount = 0;
    groupOrder.forEach((key, idx)=>{
      const items = groups[key];
      DB.notaPesanan.push({
        id:uid(), nomor: 'NP-'+(key||'').replace(/[^0-9]/g,'').slice(-6)+'-'+(idx+1),

      });
      madeCount++;

    document.getElementById('ba_sourceNotaId').value = n.id;
    toast('Form BAST diisi dari Nota Pesanan.');
  });
  const btnAddBast = document.getElementById('btnAddBast');
  if(btnAddBast) btnAddBast.addEventListener('click', ()=>{
    const nomor = document.getElementById('ba_nomor').value;
    const raw = document.getElementById('ba_items').value.trim();
    if(!nomor || !raw){ toast('Isi nomor BAST dan daftar barang.'); return; }
    const items = raw.split('\n').filter(l=>l.trim()).map(l=>{
      const parts = l.split('|').map(s=>s.trim());
      return { nama:parts[0]||'', dipesan:Number(parts[1]||0), baik:Number(parts[2]||0), rusak:Number(parts[3]||0) };
    });

/* Membaca file gambar logo sebagai base64 data URL dan menyimpannya ke profil sekolah */
function handleLogoUpload(input, field){
  const file = input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('File harus berupa gambar (PNG/JPG).'); input.value=''; return; }
  if(file.size > 1024*1024){ toast('Ukuran file maksimal 1MB.'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    DB.profil[field] = e.target.result;
    saveDB();
    toast('Logo berhasil diunggah.');
    render();
  };
  reader.onerror = ()=>{ toast('Gagal membaca file gambar.'); };
  reader.readAsDataURL(file);
}

/* ============ IMPORTIR RPD / RKAS / BKU (format resmi ARKAS, Excel/CSV) ============ */
const BULAN_ID = {januari:0,februari:1,maret:2,april:3,mei:4,juni:5,juli:6,agustus:7,september:8,oktober:9,november:10,desember:11};
function parseIndoDate(val){
  if(val==null || val==='') return '';
  if(typeof val === 'number'){ // Excel serial date
    const d = XLSX.SSF.parse_date_code(val);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = String(val).trim().toLowerCase();
  const m = s.match(/(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/);
  if(m){
    const day = m[1].padStart(2,'0');
    const bln = BULAN_ID[m[2]];
    if(bln!=null) return `${m[3]}-${String(bln+1).padStart(2,'0')}-${day}`;
  }
  const m2 = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
  const m3 = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m3) return `${m3[3]}-${m3[2].padStart(2,'0')}-${m3[1].padStart(2,'0')}`;
  return '';
}
function toNumber(v){
  if(v==null || v==='') return 0;
  if(typeof v === 'number') return v;
  const s = String(v).replace(/[^\d,.\-]/g,'').replace(/\./g,'').replace(/,/g,'.');
  const n = parseFloat(s);
  return isNaN(n)?0:n;
}
function isBlankish(v){
  if(v==null) return true;
  const s = String(v).trim();
  if(s==='') return true;
  // placeholder dots used in the official ARKAS BKU template for empty "Penerima"
  if(/^[.…\s]+$/.test(s)) return true;
  return false;
}
function readWorkbook(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const wb = XLSX.read(e.target.result, {type:'binary', cellDates:false});
    cb(wb);
  };
  reader.readAsBinaryString(file);
}
function sheetToRows(wb, sheetName){
  const sheet = wb.Sheets[sheetName];
  if(!sheet) return null;
  return XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
}
function pickSheet(wb, preferredNames){
  // 1) exact/case-insensitive match on preferred sheet names, in priority order
  for(const pref of preferredNames){
    const found = wb.SheetNames.find(n=> n.trim().toLowerCase() === pref.toLowerCase());
    if(found) return found;
  }
  // 2) sheet name containing the preferred keyword
  for(const pref of preferredNames){
    const found = wb.SheetNames.find(n=> n.trim().toLowerCase().includes(pref.toLowerCase()));
    if(found) return found;
  }
  // 3) fallback: first sheet
  return wb.SheetNames[0];
}

/* Combine two header rows (main + sub, as used by the official RKAS/RPD template where
   cells like "TAHAP I" / "RINCIAN PERHITUNGAN" are merged across two rows and several columns)
   into a single flat header-label array, forward-filling merged blanks. */
function buildCombinedHeader(rowA, rowB, width){
  const filledA = [];
  let last = '';
  for(let i=0;i<width;i++){
    const v = String(rowA[i]||'').trim();
    if(v) last = v;
    filledA.push(last);
  }
  const combined = [];
  for(let i=0;i<width;i++){
    const b = String((rowB&&rowB[i])||'').trim();
    combined.push(b || filledA[i]);
  }
  return combined;
}
function colIndexFor(headerRow, aliases){
  const norm = headerRow.map(c=>String(c||'').toLowerCase().trim());
  for(const a of aliases){
    const idx = norm.findIndex(c=> c.includes(a));
    if(idx !== -1) return idx;
  }
  return -1;
}
function findRowIndexContaining(rows, needle, maxScan){
  const scan = Math.min(rows.length, maxScan||20);
  for(let i=0;i<scan;i++){
    const rowText = (rows[i]||[]).map(c=>String(c||'').toLowerCase().trim());
    if(rowText.some(c=>c.includes(needle))) return i;
  }
  return -1;
}
/* Try to read a label like "Sumber Dana" / "Nama Sekolah" from the info block at the top of the sheet */
function readInfoLabel(rows, label, maxScan){
  const scan = Math.min(rows.length, maxScan||10);
  for(let i=0;i<scan;i++){
    const r = rows[i]||[];
    for(let c=0;c<r.length;c++){
      if(String(r[c]||'').trim().toLowerCase().startsWith(label.toLowerCase())){
        for(let c2=c+1;c2<r.length;c2++){
          if(String(r[c2]||'').trim()!=='') return String(r[c2]).trim();
        }
      }
    }
  }
  return '';
}

/* -------- RPD / RKAS import -------- */
function importRkasFile(file){
  readWorkbook(file, wb=>{
    const sheetName = pickSheet(wb, ['RPD','RKAS']);
    const rows = sheetToRows(wb, sheetName);
    if(!rows){ document.getElementById('importRkasStatus').textContent = 'Sheet tidak ditemukan pada file.'; return; }

    const hIdx = findRowIndexContaining(rows, 'kode rekening', 20);
    if(hIdx === -1){ document.getElementById('importRkasStatus').textContent = 'Format tidak dikenali: kolom "Kode Rekening" tidak ditemukan.'; return; }
    const rowA = rows[hIdx];
    const rowB = rows[hIdx+1] || [];
    const width = Math.max(rowA.length, rowB.length, 14);
    const header = buildCombinedHeader(rowA, rowB, width);

    const cKode = colIndexFor(header,['kode rekening']);
    const cNamaRef = colIndexFor(header,['nama referensi']);
    const cProgram = colIndexFor(header,['program kegiatan']);
    const cUraian = colIndexFor(header,['uraian']);
    const cVol = colIndexFor(header,['vol']);
    const cSatuan = colIndexFor(header,['satuan']);
    const cHarga = colIndexFor(header,['harga satuan']);
    const cJumlah = colIndexFor(header,['jumlah']);
    const cTw1 = colIndexFor(header,['triwulan 1']);
    const cTw2 = colIndexFor(header,['triwulan 2']);
    const cTw3 = colIndexFor(header,['triwulan 3']);
    const cTw4 = colIndexFor(header,['triwulan 4']);
    const hasTriwulan = cTw1!==-1 || cTw2!==-1 || cTw3!==-1 || cTw4!==-1;

    const sumberDana = readInfoLabel(rows, 'Sumber Dana', hIdx) || 'BOS Reguler';
    const tahapInfo = readInfoLabel(rows, 'Tahap', hIdx) || '';
    const dataRows = rows.slice(hIdx+2);

    let count = 0, skipped = 0;
    dataRows.forEach(r=>{
      if(!r || !r.some(c=>String(c||'').trim()!=='')) return;
      const uraianTxt = cUraian!==-1? String(r[cUraian]||'').trim() : '';
      if(!uraianTxt || uraianTxt.toUpperCase()==='TOTAL'){ return; }
      const volume = cVol!==-1? toNumber(r[cVol]) : 0;
      const harga = cHarga!==-1? toNumber(r[cHarga]) : 0;
      // Only leaf rows (actual line items) carry Vol./Harga Satuan — category/subtotal rows don't.
      if(!(volume>0 && harga>0)){ skipped++; return; }

      const kode = cKode!==-1? String(r[cKode]||'').trim() : '';
      const namaReferensi = cNamaRef!==-1? String(r[cNamaRef]||'').trim() : '';
      const programKegiatanSNP = cProgram!==-1? String(r[cProgram]||'').trim() : '';
      const jumlah = cJumlah!==-1 && toNumber(r[cJumlah])>0 ? toNumber(r[cJumlah]) : volume*harga;

      DB.rkas.push({
        id:uid(), kode, namaReferensi, programKegiatanSNP, uraian:uraianTxt,
        sumber:sumberDana, tahap:tahapInfo, volume, satuan: cSatuan!==-1? String(r[cSatuan]||'').trim():'', harga, jumlah
      });
      count++;
    });
    saveDB();
    document.getElementById('importRkasStatus').textContent = `Sheet "${sheetName}": berhasil impor ${count} rincian RPD (${skipped} baris kategori/subtotal dilewati).`;
    toast(`Impor RPD selesai: ${count} baris ditambahkan.`);
    render();
  });
}

/* -------- BKU import -------- */
function importBkuFile(file){
  readWorkbook(file, wb=>{
    const sheetName = pickSheet(wb, ['BKU']);
    const rows = sheetToRows(wb, sheetName);
    if(!rows){ document.getElementById('importBkuStatus').textContent = 'Sheet tidak ditemukan pada file.'; return; }

    const hIdx = findRowIndexContaining(rows, 'tanggal', 20);
    if(hIdx === -1){ document.getElementById('importBkuStatus').textContent = 'Format tidak dikenali: kolom "Tanggal" tidak ditemukan.'; return; }
    const header = (rows[hIdx]||[]).map(c=>String(c||'').trim());
    const dataRows = rows.slice(hIdx+1).filter(r=> r.some(c=>String(c||'').trim()!==''));

    const cTgl = colIndexFor(header,['tanggal']);
    const cBukti = colIndexFor(header,['no bukti','no. bukti','nomor bukti']);
    const cProgram = colIndexFor(header,['program kegiatan']);
    const cKode = colIndexFor(header,['kode rekening']);
    const cNamaRek = colIndexFor(header,['nama rekening']);
    const cUraian = colIndexFor(header,['uraian']);
    const cMasuk = colIndexFor(header,['penerimaan']);
    const cKeluar = colIndexFor(header,['pengeluaran']);
    const cPenerima = colIndexFor(header,['penerima']);

    let count = 0, skipped = 0;
    dataRows.forEach(r=>{
      const uraian = cUraian!==-1? String(r[cUraian]||'').trim() : '';
      const masuk = cMasuk!==-1? toNumber(r[cMasuk]) : 0;
      const keluar = cKeluar!==-1? toNumber(r[cKeluar]) : 0;
      // Skips rows with no amount at all — this includes the "SALDO AWAL ..." opening-balance line.
      if(!uraian || (masuk===0 && keluar===0)){ skipped++; return; }
      const tanggal = cTgl!==-1? parseIndoDate(r[cTgl]) : '';
      const namaRekening = cNamaRek!==-1? String(r[cNamaRek]||'').trim() : '';
      const programKegiatanSNP = cProgram!==-1? String(r[cProgram]||'').trim() : '';
      const kodeRekening = cKode!==-1? String(r[cKode]||'').trim() : '';
      const penerimaRaw = cPenerima!==-1? String(r[cPenerima]||'').trim() : '';
      const penerima = isBlankish(penerimaRaw) ? '' : penerimaRaw;

      const textForGuess = (uraian+' '+namaRekening).toLowerCase();
      let metode = 'tunai';
      if(/\bbank\b|transfer|giro|rekening koran|pergeseran/.test(textForGuess)) metode = 'bank';

      const tipe = masuk>0 ? 'masuk' : 'keluar';
      const bruto = masuk>0 ? masuk : keluar;
      DB.transaksi.push({
        id:uid(), tanggal, noBukti: cBukti!==-1? String(r[cBukti]||'').trim(): '', uraian,
        kodeRekening, namaRekening, programKegiatanSNP,
        jenisPembayaran: metode, tipe, jumlahBruto: bruto,
        pajak:{jenis:'Tidak dipungut', persen:0, nominal:0},
        jumlahNetto: bruto,
        penerima
      });
      count++;
    });
    saveDB();
    document.getElementById('importBkuStatus').textContent = `Sheet "${sheetName}": berhasil impor ${count} transaksi BKU (${skipped} baris dilewati, termasuk saldo awal/baris kosong).`;
    toast(`Impor BKU selesai: ${count} transaksi ditambahkan.`);
    render();
  });
}

function downloadFile(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

render();
